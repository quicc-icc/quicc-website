name: Update Publications

# Una vez por semana trae las publicaciones de ORCID y, si cambiaron,
# las commitea y lanza el deploy del sitio.
# También se puede correr a mano: Actions → Update Publications → Run workflow.

on:
  schedule:
    - cron: "17 6 * * 1" # lunes 06:17 UTC (03:17 en Buenos Aires)
  workflow_dispatch:

permissions:
  contents: write # commitear publications.json
  actions: write # lanzar el deploy y mantener activo el cron

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Fetch publications
        run: npm run fetch:pubs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json
          if git diff --cached --quiet; then
            echo "Sin publicaciones nuevas."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update publications"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Un push hecho con GITHUB_TOKEN no dispara otros workflows,
      # así que el deploy se lanza explícitamente (workflow_dispatch sí está permitido).
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main

      # GitHub desactiva los cron de repos públicos tras 60 días sin actividad.
      # Re-habilitar el workflow en cada corrida reinicia ese contador.
      - name: Keep schedule alive
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        run: gh workflow enable update-publications.yml
