name: Deploy Astro to GitHub Pages

# Publica el sitio en cada cambio en main.
# En los pull requests sólo compila, para detectar errores antes de aceptar cambios.
# También se puede correr a mano (Actions → Deploy Astro to GitHub Pages → Run workflow)
# y lo dispara automáticamente "Update Publications" cuando hay publicaciones nuevas.
# Además corre una vez por año (1 de enero) para que la página de publicaciones
# actualice el corte de "últimos 5 años", que se calcula al compilar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7 6 1 1 *" # 1 de enero, 06:07 UTC (03:07 en Buenos Aires)

permissions:
  contents: read

concurrency:
  # Los deploys a producción se encolan (nunca se cancelan a mitad de camino);
  # los chequeos de un PR se reemplazan por el más reciente.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
